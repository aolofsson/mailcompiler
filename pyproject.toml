[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailcompiler"
version = "0.1.0"
description = "Contact list management tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Andreas Olofsson", email = "andreas@zeroasic.com" }]
keywords = ["email", "mbox", "contacts", "crm", "sales", "marketing"]
classifiers = [
    "Private :: Do Not Upload",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["libpff-python>=20231205", "phonenumbers>=8"]

[project.optional-dependencies]
dev = ["flake8>=7", "pytest>=8"]

[project.scripts]
mc = "mailcompiler.mailcompiler:main"

[tool.setuptools.packages.find]
include = ["mailcompiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
